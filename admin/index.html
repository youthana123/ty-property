<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>หลังร้าน | TY Property</title>
<link rel="icon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2559;--blue:#1f5bd8;--mist:#f4f7fc;--stone:#5b6778;--line:#e1e7f0;--ok:#14794a;--hold:#a15c07;--gone:#8a94a3;--bad:#b42318;--shadow:0 1px 2px rgba(11,37,89,.06),0 8px 24px rgba(11,37,89,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--mist);color:var(--ink);font:400 15px/1.6 Sarabun,system-ui,sans-serif}
h1,h2,h3,button,.brand b,.stat b{font-family:Prompt,sans-serif}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{display:block;font-size:16px;letter-spacing:.03em}
.brand small{color:var(--stone)}
main{max-width:1240px;margin:0 auto;padding:32px 24px 64px}
.head h2{font-size:24px;margin:0}
.head p{margin:2px 0 20px;color:var(--stone);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.stat span{color:var(--stone);font-size:14px}
.stat b{display:block;font-size:26px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.table-card{overflow-x:auto}
.form{position:sticky;top:24px;display:grid;gap:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--stone);font-size:13px;font-weight:500}
tr:last-child td{border-bottom:0}
td small{color:var(--stone)}
.th{width:64px;height:48px;border-radius:10px;background:#e3ebfa center/cover no-repeat}
.amt{white-space:nowrap;font-weight:500}
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-available{color:var(--ok)}.s-reserved{color:var(--hold)}.s-sold{color:var(--gone)}
.acts{white-space:nowrap;text-align:right}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:10px;transition:background .2s}
button:hover{background:var(--mist)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.primary:hover{background:var(--ink)}
button.danger{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
label{display:grid;gap:5px;font-size:14px;color:var(--stone)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{display:flex;gap:10px}
.actions button{flex:1}
.empty{color:var(--stone);text-align:center;padding:36px 0}
#msg{min-height:22px;color:var(--stone);font-size:14px;margin:0}
@media(max-width:960px){.cols{grid-template-columns:1fr}.form{position:static}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><img src="mark.png" alt=""><div><b>TY Property</b><small>หลังร้าน</small></div></div>
  <button onclick="logout()">ออกจากระบบ</button>
</div></header>

<main>
  <div class="head">
    <h2>รายการขาย</h2>
    <p>แก้ไขแล้วหน้าร้านจะแสดงข้อมูลใหม่เมื่อรีเฟรช</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cols">
    <div class="card table-card">
      <table>
        <thead><tr><th></th><th>แปลง</th><th>ราคา</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <form class="card form" onsubmit="save(event)">
      <h3 id="ftitle" style="margin:0;font-size:18px">เพิ่มรายการใหม่</h3>
      <input id="f_id" type="hidden">
      <label>ชื่อแปลง<input id="f_title" required></label>
      <label>ทำเล / ที่อยู่<input id="f_location"></label>
      <label>เอกสารสิทธิ์
        <input id="f_deed_type" list="deeds" placeholder="เช่น น.ส.4 จ.">
        <datalist id="deeds"><option value="น.ส.4 จ."><option value="น.ส.4 ก."><option value="น.ส.3 ก."><option value="น.ส.3"></datalist>
      </label>
      <div class="three">
        <label>ไร่<input id="f_rai" type="number" min="0"></label>
        <label>งาน<input id="f_ngan" type="number" min="0"></label>
        <label>ตร.ว.<input id="f_wah" type="number" min="0"></label>
      </div>
      <label>ราคาเสนอขาย (บาท)<input id="f_price" type="number" min="0" step="1000"></label>
      <label>สถานะ
        <select id="f_status"><option value="available">ว่างขาย</option><option value="reserved">จองแล้ว</option><option value="sold">ขายแล้ว</option></select>
      </label>
      <label>รายละเอียด<textarea id="f_description" rows="4"></textarea></label>
      <label>ลิงก์รูปภาพ (บรรทัดละ 1 ลิงก์ ต้องเปิดได้แบบสาธารณะ)<textarea id="f_images" rows="3" placeholder="https://..."></textarea></label>
      <div class="actions"><button type="button" onclick="fill()">ล้างฟอร์ม</button><button class="primary">บันทึก</button></div>
      <p id="msg"></p>
    </form>
  </div>
</main>

<script>
const API = 'https://ty-property-api.onrender.com'; // เปลี่ยนเป็น URL ของ API บน Render

const STATUS = { available: 'ว่างขาย', reserved: 'จองแล้ว', sold: 'ขายแล้ว' };
const FIELDS = ['title', 'location', 'deed_type', 'rai', 'ngan', 'wah', 'price', 'status', 'description'];
const DEF = { status: 'available', rai: 0, ngan: 0, wah: 0, price: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '฿' + Number(n).toLocaleString('th-TH');
let key = sessionStorage.getItem('adminKey') || '';
let listings = [];

async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': key } });
  } catch {
    throw new Error('เชื่อมต่อ API ไม่ได้ ระบบอาจกำลังเริ่มทำงาน ลองอีกครั้งในอีกสักครู่');
  }
  if (r.status === 401) {
    sessionStorage.removeItem('adminKey');
    location.replace('login.html');
    throw new Error('กรุณาเข้าสู่ระบบอีกครั้ง');
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'เชื่อมต่อ API ไม่ได้ (HTTP ' + r.status + ')');
  return data;
}

async function load() {
  listings = await api('/api/listings');
  const n = s => listings.filter(l => l.status === s).length;
  $('stats').innerHTML = [['ทั้งหมด', listings.length], ['ว่างขาย', n('available')], ['จองแล้ว', n('reserved')], ['ขายแล้ว', n('sold')]]
    .map(([t, v]) => `<div class="stat"><span>${t}</span><b>${v}</b></div>`).join('');
  $('rows').innerHTML = listings.map(l => `<tr>
      <td><div class="th" style="${l.images[0] ? `background-image:url('${esc(l.images[0])}')` : ''}"></div></td>
      <td><b>${esc(l.title)}</b><br><small>${esc(l.location)}</small></td>
      <td class="amt">${money(l.price)}</td>
      <td><span class="st s-${l.status}">${STATUS[l.status]}</span></td>
      <td class="acts"><button onclick="fill(${l.id})">แก้ไข</button> <button class="danger" onclick="remove(${l.id})">ลบ</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">ยังไม่มีรายการ เพิ่มแปลงแรกจากฟอร์มด้านขวา</td></tr>';
}

function fill(id) {
  const l = listings.find(x => x.id === id) || {};
  $('f_id').value = l.id || '';
  FIELDS.forEach(f => ($('f_' + f).value = l[f] ?? DEF[f] ?? ''));
  $('f_images').value = (l.images || []).join('\n');
  $('ftitle').textContent = l.id ? 'แก้ไข: ' + l.title : 'เพิ่มรายการใหม่';
  $('msg').textContent = '';
  if (l.id) scrollTo({ top: 0, behavior: 'smooth' });
}

async function save(e) {
  e.preventDefault();
  const id = $('f_id').value;
  const body = Object.fromEntries(FIELDS.map(f => [f, $('f_' + f).value]));
  body.images = $('f_images').value.split('\n').map(s => s.trim()).filter(Boolean);
  try {
    await api(id ? `/api/listings/${id}` : '/api/listings', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
    await load();
    fill();
    $('msg').textContent = 'บันทึกแล้ว หน้าร้านจะแสดงข้อมูลใหม่เมื่อรีเฟรช';
  } catch (err) {
    $('msg').textContent = 'บันทึกไม่สำเร็จ: ' + err.message;
  }
}

async function remove(id) {
  const l = listings.find(x => x.id === id);
  if (!confirm(`ลบ "${l.title}" ใช่ไหม การลบไม่สามารถย้อนกลับได้`)) return;
  try {
    await api(`/api/listings/${id}`, { method: 'DELETE' });
    await load();
    if ($('f_id').value == id) fill();
  } catch (err) {
    $('msg').textContent = 'ลบไม่สำเร็จ: ' + err.message;
  }
}

function logout() {
  sessionStorage.removeItem('adminKey');
  location.replace('login.html');
}

if (key) load().then(fill).catch(err => { $('msg').textContent = err.message; });
else location.replace('login.html');
</script>
</body>
</html>
