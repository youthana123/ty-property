<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบหลังร้าน | TY Property</title>
<link rel="icon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2559;--blue:#1f5bd8;--mist:#f4f7fc;--stone:#5b6778;--line:#e1e7f0;--bad:#b42318;--shadow:0 1px 2px rgba(11,37,89,.06),0 10px 28px rgba(11,37,89,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--mist);color:var(--ink);font:400 16px/1.6 Sarabun,system-ui,sans-serif}
h1{font-family:Prompt,sans-serif;font-size:26px;margin:14px 0 4px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#fff;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.out{opacity:0;visibility:hidden}
.intro-in{display:grid;justify-items:center;gap:2px;text-align:center}
#intro img{width:104px;opacity:0;transform:translateY(12px);animation:up .9s .15s cubic-bezier(.2,.7,.2,1) forwards}
.arc{width:230px;height:40px;overflow:visible}
.arc path{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s .5s ease-in-out forwards}
.intro-word{font-family:Prompt,sans-serif;font-weight:600;font-size:18px;letter-spacing:.16em;color:var(--ink);opacity:0;animation:up .8s 1.3s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}

.card{width:min(400px,100%);background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:44px 36px 36px;text-align:center;animation:up .8s 1.1s ease-out both}
.logo{width:72px;height:72px;object-fit:contain}
.lead{color:var(--stone);margin:0 0 28px;font-size:15px}
label{display:grid;gap:6px;text-align:left;font-size:14px;color:var(--stone);margin-bottom:18px}
input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);width:100%}
input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
button{width:100%;font-family:Prompt,sans-serif;font-weight:600;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;transition:background .2s}
button:hover{background:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:24px;color:var(--bad);font-size:14px;margin:14px 0 0}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="intro-in">
    <img src="mark.png" alt="">
    <svg class="arc" viewBox="0 0 230 40"><path d="M6 34 Q115 -6 224 34"/></svg>
    <div class="intro-word">TY PROPERTY</div>
  </div>
</div>

<form class="card" id="login">
  <img class="logo" src="mark.png" alt="">
  <h1>หลังร้าน</h1>
  <p class="lead">สำหรับทีมงาน TY Property ใส่รหัสผู้ดูแลเพื่อจัดการรายการขาย</p>
  <label>รหัสผู้ดูแล<input id="key" type="password" autocomplete="current-password" required></label>
  <button id="go">เข้าสู่ระบบ</button>
  <p id="msg" role="status"></p>
</form>

<script>
const API = 'https://ty-property-api.onrender.com'; // เปลี่ยนเป็น URL ของ API บน Render
const $ = id => document.getElementById(id);

// ถ้าเข้าแล้วในแท็บนี้ ไปหน้าหลังร้านเลย
if (sessionStorage.getItem('adminKey')) location.replace('index.html');

(function intro() {
  const el = $('intro');
  if (sessionStorage.getItem('introSeen') || matchMedia('(prefers-reduced-motion: reduce)').matches) return el.remove();
  sessionStorage.setItem('introSeen', '1');
  const done = () => { el.classList.add('out'); setTimeout(() => el.remove(), 700); };
  el.onclick = done;
  setTimeout(done, 2600);
})();

$('login').onsubmit = async e => {
  e.preventDefault();
  const key = $('key').value.trim(), btn = $('go');
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';
  $('msg').textContent = '';
  let text = 'เชื่อมต่อ API ไม่ได้ ระบบอาจกำลังเริ่มทำงาน ลองอีกครั้งในอีกสักครู่';
  try {
    const r = await fetch(API + '/api/auth', { headers: { 'x-admin-key': key } });
    if (r.status === 401) text = 'รหัสไม่ถูกต้อง ลองตรวจสอบอีกครั้ง';
    else if (r.ok) {
      sessionStorage.setItem('adminKey', key);
      return location.replace('index.html');
    }
  } catch (err) {
    // เครือข่ายขัดข้อง ใช้ข้อความด้านบน
  }
  $('msg').textContent = text;
  btn.disabled = false;
  btn.textContent = 'เข้าสู่ระบบ';
};
</script>
</body>
</html>
