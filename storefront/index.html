<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TY Property Land & Auction | ที่ดินและบ้านซื้อขายตรง</title>
<meta name="description" content="ที่ดินและบ้านคัดสรร ซื้อขายตรง ตรวจข้อมูลก่อนตัดสินใจ วางเงินมัดจำผ่านบัญชีเอสโครว์">
<meta property="og:title" content="TY Property Land & Auction">
<meta property="og:description" content="ที่ดินและบ้านคัดสรร ซื้อขาย">
<link rel="icon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2559;--blue:#1f5bd8;--mist:#f4f7fc;--stone:#5b6778;--line:#e1e7f0;--ok:#14794a;--hold:#a15c07;--gone:#8a94a3;--red:#e11d48;--shadow:0 1px 2px rgba(11,37,89,.06),0 10px 28px rgba(11,37,89,.07)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.7 Sarabun,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand b,.price,.stats b,.fb,.specs b,.mini h4,.mini p{font-family:Prompt,sans-serif;line-height:1.3;margin:0}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.muted{color:var(--stone)}

/* เปิดเว็บ: โลโก้ปรากฏ เส้นโค้งวาดตามโลโก้ แล้วชื่อแบรนด์ค่อยๆ ขึ้น */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#fff;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.out{opacity:0;visibility:hidden}
.intro-in{display:grid;justify-items:center;gap:2px;text-align:center}
#intro img{width:104px;opacity:0;transform:translateY(12px);animation:up .9s .15s cubic-bezier(.2,.7,.2,1) forwards}
.arc{width:230px;height:40px;overflow:visible}
.arc path{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s .5s ease-in-out forwards}
.intro-word{font-family:Prompt,sans-serif;font-weight:600;font-size:18px;letter-spacing:.16em;color:var(--ink);opacity:0;animation:up .8s 1.3s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}

header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px}
.right{display:flex;align-items:center;gap:4px;min-width:0}
#acct{display:flex;align-items:center;gap:4px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.brand img{height:42px;width:42px;object-fit:contain}
.brand b{font-size:17px;letter-spacing:.04em;display:block;white-space:nowrap}
.brand small{color:var(--stone);font-size:13px}
nav{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;justify-content:flex-end}
nav a{color:var(--stone);text-decoration:none;padding:8px 13px;border-radius:999px;font-weight:500}
nav a:hover{background:var(--mist);color:var(--ink)}
.me{display:flex;align-items:center;gap:8px;margin:0 6px 0 10px;font-weight:500}
nav a.login,nav a.login:hover{background:var(--blue);color:#fff}
.me img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.out{border:1px solid var(--line);background:#fff;color:var(--stone);padding:6px 14px;border-radius:999px}
.out:hover{color:var(--ink)}


.hero{background:var(--mist);border-bottom:1px solid var(--line)}
.hero-in{max-width:1140px;margin:0 auto;padding:72px 24px 64px;display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(30px,4.2vw,46px);font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--stone);font-size:18px;max-width:32em;margin:16px 0 0}
.stats{display:flex;gap:44px;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:26px;font-weight:600}
.stats span{color:var(--stone);font-size:14px}
.plate{background:#fff;border-radius:24px;padding:40px;display:flex;justify-content:center;box-shadow:var(--shadow)}
.plate img{max-width:100%;max-height:320px;object-fit:contain}
.pagehead{max-width:1140px;margin:0 auto;padding:48px 24px 8px}
.pagehead h1{font-size:32px}
.pagehead p{margin:6px 0 0;color:var(--stone)}

.tools{position:sticky;top:72px;z-index:5;display:flex;gap:10px;flex-wrap:wrap;padding:20px 0;background:#fff;border-bottom:1px solid var(--line)}
.tools input,.tools select{font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.tools input{flex:1;min-width:220px}
.tools select{cursor:pointer}
.list{padding-bottom:72px}
.row{display:grid;grid-template-columns:168px 1fr auto;gap:24px;align-items:center;padding:20px 12px;margin:0 -12px;border-bottom:1px solid var(--line);border-radius:14px;cursor:pointer;transition:background .2s}
.row:hover{background:var(--mist)}
.row:hover .thumb{transform:scale(1.03)}
.row:hover h3{color:var(--blue)}
.row.sold{opacity:.62}
.row.sold .thumb{filter:grayscale(.8)}
.thumb{width:168px;height:116px;border-radius:14px;background:#e3ebfa center/cover no-repeat;transition:transform .35s ease}
.row h3{font-size:19px;font-weight:600}
.chip{display:inline-block;font-family:Sarabun,sans-serif;font-size:12px;font-weight:500;background:var(--mist);color:var(--stone);padding:2px 10px;border-radius:999px;margin-left:6px;vertical-align:middle}
.meta{color:var(--stone);font-size:15px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:14px;font-weight:500}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-available{color:var(--ok)}.s-reserved{color:var(--hold)}.s-sold{color:var(--gone)}
.price{font-size:21px;font-weight:600;text-align:right;white-space:nowrap}
.empty{color:var(--stone);padding:48px 0}
.heart{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--stone);display:grid;place-items:center;transition:all .2s;flex:none}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.heart:hover{color:var(--red);border-color:#f5c2cc}
.heart.on{color:var(--red);border-color:#f5c2cc;background:#fff1f3}
.heart.on svg{fill:currentColor}

.detail{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;padding-top:40px;align-items:start}
.gallery{position:relative;height:420px;border-radius:20px;background:#e3ebfa center/cover no-repeat;box-shadow:var(--shadow)}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:26px;line-height:1}
.gnav.prev{left:12px}.gnav.next{right:12px}
.cnt{position:absolute;right:14px;bottom:12px;background:rgba(11,37,89,.72);color:#fff;padding:2px 10px;border-radius:999px;font-size:13px}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs div{width:92px;height:66px;border-radius:10px;background:#e3ebfa center/cover no-repeat;cursor:pointer;border:2px solid transparent}
.thumbs div:hover,.thumbs div.on{border-color:var(--blue)}
.row-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ttl{font-size:30px;margin:12px 0 0}
.big{text-align:left;font-size:30px;color:var(--blue);margin-top:10px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}
.specs div{background:var(--mist);border-radius:14px;padding:14px 16px}
.specs b{display:block;font-size:17px;font-weight:600}
.specs span{font-size:13px;color:var(--stone)}
dl{display:grid;grid-template-columns:auto 1fr;gap:14px 28px;margin:22px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
dt{color:var(--stone)}
dd{margin:0;font-weight:500}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 16px}
.btn{display:inline-flex;align-items:center;background:var(--blue);color:#fff;padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:600;transition:background .2s;border:0}
.btn:hover{background:var(--ink)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--mist)}
.btn.sm{padding:9px 14px;font-size:14px}
.linkrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 24px}
.sub{font-size:18px;margin:0 0 8px}
.steps{list-style:none;counter-reset:s;margin:0 0 8px;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(s);font-family:Prompt,sans-serif;font-weight:600;color:var(--blue)}

.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-top:32px;box-shadow:var(--shadow)}
.panel h3{font-size:19px;margin-bottom:16px}
.panel form{display:grid;gap:12px}
.panel label{display:grid;gap:6px;font-size:14px;color:var(--stone)}
.panel input,.panel select,.panel textarea{font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);width:100%;background:#fff}
.panel .consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--stone)}
.panel .consent input{width:auto;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fmsg{font-size:14px;color:var(--stone);margin:0;min-height:20px}
.panel button.btn{justify-self:start}
.similar{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mini{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.mini .t{height:120px;background:#e3ebfa center/cover no-repeat}
.mini .x{padding:12px 14px}
.mini h4{font-size:15px;font-weight:600}
.mini p{margin:4px 0 0;color:var(--blue);font-weight:600}

.page{max-width:720px;margin:0 auto;padding:48px 24px 80px}
.page h1{font-size:30px}
.page .lead{font-size:18px;color:var(--stone);margin:12px 0 28px}
.page .panel{margin-top:28px}

footer{background:var(--ink);color:#c9d4e8;padding:32px 0;font-size:15px}
footer small{opacity:.85}
footer a{color:#fff}
footer .fb{color:#fff;font-size:17px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px}
.socials{display:flex;gap:10px}
.soc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;transition:background .2s}
.soc:hover{background:var(--blue)}
.soc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:820px){
  .hero-in,.detail{grid-template-columns:1fr;gap:32px}
  .hero-in{padding:48px 24px}
  .plate{order:-1;padding:24px}
  .row{grid-template-columns:96px 1fr;gap:16px}
  .thumb{width:96px;height:76px}
  .side{grid-column:2;flex-direction:row;justify-content:space-between;align-items:center;width:100%}
  .gallery{height:280px}
  .two{grid-template-columns:1fr}
  .me span{display:none}

  /* มือถือ: หัวเว็บสองแถว คือ โลโก้+บัญชีในแถวแรก และเมนูเลื่อนแนวนอนในแถวสอง */
  .bar{height:auto;flex-wrap:wrap;padding-top:10px;row-gap:4px;column-gap:8px}
  .brand img{height:38px;width:38px}
  .brand b{font-size:15px}
  .right{display:contents}
  .brand{order:1;min-width:0}
  #acct{order:2;margin-left:auto;gap:6px}
  nav{order:3;width:100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px 10px}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;padding:7px 12px;font-size:15px}
  nav a:first-child{margin-left:-12px}
  nav a.login{padding:7px 14px}
  .out{padding:5px 12px;font-size:14px}
  .hero-in{padding:32px 24px 40px}
  .plate{padding:16px}
  .plate img{max-height:200px}
  .stats{gap:24px;margin-top:24px;padding-top:18px}
  .stats b{font-size:22px}
  .ttl,.big{font-size:26px}
  .tools{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 0}
  .tools input{grid-column:1/-1;min-width:0;width:100%}
  .tools select{min-width:0;width:100%}
  .list{padding-bottom:48px}
}

@media(max-width:380px){
  .wrap{padding:0 16px}
  .brand img{height:36px;width:36px}
  .brand b{font-size:15px}
  .me img{width:26px;height:26px}
  .out{padding:5px 10px;font-size:13px}
  nav{margin:0 -16px;padding:0 16px 10px}
  .hero-in{padding:28px 16px 36px}
  .row{gap:12px;grid-template-columns:84px 1fr}
  .thumb{width:84px;height:68px}
  .price{font-size:18px}
}

/* ฝากขาย: ยอดที่ผู้ขายจะได้รับหลังหักค่าบริการ */
.sell-calc{background:var(--mist);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--stone);line-height:1.8}
.sell-calc b{color:var(--ink);font-size:17px}

/* ===== ลูกเล่น ===== */
@supports not (view-transition-name:none){#app>*{animation:pageIn .5s cubic-bezier(.2,.7,.2,1) backwards}}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.row{animation:rowIn .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.plate{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.brand img{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.brand:hover img{transform:rotate(-8deg) scale(1.08)}
nav a[aria-current="page"]{color:var(--blue);background:#e9f0fd}
.btn{transition:background .2s,transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(31,91,216,.22)}
.btn:active,.heart:active{transform:scale(.96)}
.btn:disabled{opacity:.7;cursor:wait;transform:none;box-shadow:none}
.heart.pop{animation:heartPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes heartPop{0%{transform:scale(.6)}50%{transform:scale(1.28)}100%{transform:scale(1)}}
.bump{animation:bump .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes bump{0%{transform:scale(.97)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.spark{position:fixed;width:9px;height:9px;margin:-4px 0 0 -4px;pointer-events:none;z-index:80;animation:spark .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.2);opacity:0}}
.done-badge{display:inline-flex;align-items:center;gap:10px;color:var(--ok);font-weight:600;font-size:15px;animation:badgeIn .6s cubic-bezier(.3,1.5,.5,1) backwards}
.done-badge svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .2s ease forwards}
@keyframes badgeIn{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:24px;z-index:90;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(11,37,89,.25);font-weight:500;font-size:15px;max-width:calc(100% - 32px);text-align:center;opacity:0;transform:translate(-50%,24px) scale(.95);transition:opacity .3s,transform .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ===================== ระบบการเคลื่อนไหว ===================== */
:root{--out:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.3,1.5,.5,1)}

/* แถบความคืบหน้าขณะเลื่อนหน้า */
#progress{position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--blue),#7c3aed,#e11d48);transform:scaleX(0);transform-origin:0 50%;z-index:100;pointer-events:none}

/* หัวเว็บมีเงาเมื่อเลื่อนลง */
header{transition:box-shadow .35s var(--out)}
header.scrolled{box-shadow:0 10px 26px rgba(11,37,89,.08)}

/* เม็ดสีที่เลื่อนไปตามเมนูที่เปิดอยู่ */
nav{position:relative}
.links{display:flex;align-items:center;gap:4px;position:relative;z-index:1}
.pill{position:absolute;left:0;top:50%;height:38px;margin-top:-19px;border-radius:999px;background:#e9f0fd;opacity:0;transition:transform .5s var(--spring),width .45s var(--out),opacity .3s;z-index:0;pointer-events:none}
nav a[aria-current="page"]{color:var(--blue);background:none}

/* เปลี่ยนหน้า: เลื่อนไปทางเดียวกับการกด หัวเว็บยังอยู่กับที่ */
header{view-transition-name:site-header}
::view-transition-old(site-header),::view-transition-new(site-header){animation:none}
::view-transition-old(root){animation:vt-out .28s var(--out) both}
::view-transition-new(root){animation:vt-in .48s var(--out) both}
html[data-nav="forward"]::view-transition-old(root){animation-name:vt-out-left}
html[data-nav="forward"]::view-transition-new(root){animation-name:vt-in-right}
html[data-nav="back"]::view-transition-old(root){animation-name:vt-out-right}
html[data-nav="back"]::view-transition-new(root){animation-name:vt-in-left}
@keyframes vt-out{to{opacity:0;transform:translateY(-8px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out-left{to{opacity:0;transform:translateX(-36px)}}
@keyframes vt-in-right{from{opacity:0;transform:translateX(36px)}}
@keyframes vt-out-right{to{opacity:0;transform:translateX(36px)}}
@keyframes vt-in-left{from{opacity:0;transform:translateX(-36px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* หน้าแรก: ข้อความและตัวเลขทยอยปรากฏ */
.hero-in>div:first-child>*{animation:rise .8s var(--out) backwards}
.hero-in>div:first-child>*:nth-child(2){animation-delay:.1s}
.hero-in>div:first-child>*:nth-child(3){animation-delay:.2s}
.plate{animation:rise .9s .15s var(--out) backwards,float 6s 1.05s ease-in-out infinite}
.plate img{transition:transform .5s var(--out)}

/* การ์ดรายการ */
.row{transition:background .25s,transform .35s var(--out),box-shadow .35s var(--out)}
.row:hover{transform:translateY(-2px);box-shadow:0 16px 32px -12px rgba(11,37,89,.18)}
.thumb{transition:transform .5s var(--out)}
.s-available::before{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(20,121,74,.45)}50%{box-shadow:0 0 0 6px rgba(20,121,74,0)}}
.heart svg{transition:fill .3s var(--out),transform .3s var(--out)}
.heart:hover svg{transform:scale(1.12)}
.empty{animation:rise .5s var(--out) backwards}

/* รูปที่กำลังโหลด: แถบเลื่อนแสงเป็นพื้น แล้วค่อยๆ ปรากฏ */
.pending{background:linear-gradient(100deg,#e3ebfa 30%,#f4f7fd 50%,#e3ebfa 70%)!important;background-size:220% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-20% 0}}
.img-in{animation:imgIn .6s var(--out)}
@keyframes imgIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}

/* ตัวกรองและฟอร์ม: เส้นขอบเรืองขึ้นเมื่อโฟกัส และสั่นเมื่อกรอกไม่ครบ */
.tools input,.tools select,.panel input,.panel select,.panel textarea{transition:border-color .2s,box-shadow .25s}
.tools input:focus,.tools select:focus,.panel input:focus,.panel select:focus,.panel textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,91,216,.12)}
.bad{border-color:var(--red)!important;box-shadow:0 0 0 4px rgba(225,29,72,.12)!important}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

/* ปุ่ม: แสงกระเพื่อมตอนกด และวงหมุนตอนกำลังส่ง */
.btn{position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(31,91,216,.22)}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .65s var(--out) forwards;pointer-events:none}
.btn.line .ripple{background:rgba(31,91,216,.18)}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.btn.loading{padding-left:44px;pointer-events:none}
.btn.loading::before{content:"";position:absolute;left:18px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* รายละเอียดสินทรัพย์ */
.gnav{transition:transform .25s var(--spring),background .2s}
.gnav:hover{transform:translateY(-50%) scale(1.08)}
.thumbs div{transition:transform .25s var(--spring),border-color .2s}
.thumbs div:hover{transform:translateY(-2px)}
.thumbs div.on{transform:scale(1.04)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s var(--out),transform .7s var(--out);transition-delay:calc(var(--d,0) * 80ms)}
.reveal.in{opacity:1;transform:none}

/* ท้ายเว็บ: ไอคอนโซเชียลทยอยปรากฏและเด้งเมื่อชี้ */
.soc{animation:rise .6s var(--out) backwards;animation-delay:calc(var(--i,0) * 70ms + .2s);transition:background .2s,transform .3s var(--spring)}
.soc:hover{transform:translateY(-3px) scale(1.06)}

/* ออกจากหน้าเพื่อไปเข้าสู่ระบบ/ออกจากระบบ */
body.leaving #app,body.leaving header,body.leaving footer{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}

body:not(.ready) #app *{animation:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<div id="intro" aria-hidden="true">
  <div class="intro-in">
    <img src="mark.png" alt="">
    <svg class="arc" viewBox="0 0 230 40"><path d="M6 34 Q115 -6 224 34"/></svg>

</div>

<header><div class="wrap bar">
  <a class="brand" href="#/"><img src="mark.png" alt=""><span><b>TY PROPERTY</b><small>Land &amp; Auction</small></span></a>

</div></header>

<footer><div class="wrap ft">

  </div>

</div></footer>

<div id="toast" role="status" aria-live="polite"></div>
<script>
const API = 'https://ty-property-api.onrender.com'; // เปลี่ยนเป็น URL ของ API บน Render
const CONTACT = { phone: '086-466-2344', oa: '@245kynxv' }; // oa = ID ของ LINE Official Account ที่ขึ้นต้นด้วย @
const lineUrl = text => (text
  ? `https://line.me/R/oaMessage/${CONTACT.oa}/?${encodeURIComponent(text)}`
  : `https://line.me/R/ti/p/${CONTACT.oa}`);

// ไอคอนโซเชียล: ใส่ลิงก์โปรไฟล์ที่คุณปักหน้าร้านไว้
const SOCIAL = [
  { name: 'TikTok', url: 'https://www.tiktok.com/@sekthisak_11?_r=1&_t=ZS-9AdGTCEVCgm', icon: '<path d="M14 3v11.2a3.8 3.8 0 1 1-3.8-3.8"/><path d="M14 3c.4 2.6 2.2 4.3 4.8 4.5"/>' },
  { name: 'Instagram', url: 'https://www.instagram.com/engi.neer.0/', icon: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/>' },
  { name: 'Facebook', url: 'https://www.facebook.com/share/14rgADMUZ9n/?mibextid=wwXIfr', icon: '<path d="M14.5 21v-7h2.4l.4-3h-2.8V9.3c0-.9.3-1.5 1.5-1.5H17V5.2c-.3 0-1.2-.2-2.2-.2-2.2 0-3.7 1.3-3.7 3.8V11H9v3h2.1v7"/>' },
  { name: 'YouTube', url: 'https://www.youtube.com/@your-channel', icon: '<rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10.5 9.5v5l4-2.5z"/>' },
  { name: 'LINE', url: lineUrl(), icon: '<path d="M12 4.5c-4.4 0-8 2.8-8 6.4 0 3.2 2.8 5.8 6.6 6.3.3.1.6.2.7.5.1.2 0 .8 0 1.1l-.2 1.1c-.1.4-.3 1.4 1.2.8 1.5-.6 8-4.7 8-9.8 0-3.6-3.6-6.4-8.3-6.4z"/>' },
];

const STATUS = { available: 'ว่างขาย', reserved: 'จองแล้ว', sold: 'ขายแล้ว' };
const TYPE = { land: 'ที่ดิน', house: 'บ้านเดี่ยว', townhouse: 'ทาวน์โฮม', condo: 'คอนโด', commercial: 'อาคารพาณิชย์' };
const PRICE = { 1: [0, 5e6], 2: [5e6, 20e6], 3: [20e6, 100e6], 4: [100e6, Infinity] };
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '฿' + Number(n).toLocaleString('th-TH');
const size = l => [l.rai && `${l.rai} ไร่`, l.ngan && `${l.ngan} งาน`, l.wah && `${l.wah} ตร.ว.`].filter(Boolean).join(' ') || '-';
const brief = l => (l.property_type === 'land'
  ? size(l)
  : [l.bedrooms && `${l.bedrooms} ห้องนอน`, l.bathrooms && `${l.bathrooms} ห้องน้ำ`, l.usable_sqm && `${l.usable_sqm} ตร.ม.`].filter(Boolean).join(' · ') || '-');
const img = u => (u ? `background-image:url('${esc(u)}')` : '');
const badge = l => `<span class="status s-${l.status}">${STATUS[l.status]}</span>`;
const chip = l => `<span class="chip">${TYPE[l.property_type] || TYPE.land}</span>`;
const heart = l => `<button class="heart ${l.liked ? 'on' : ''}" aria-label="ถูกใจ" title="ถูกใจ" onclick="like(${l.id},event)">${HEART}</button>`;
const consentBox = () => `<label class="consent"><input type="checkbox" name="consent" required>
  <span>ยินยอมให้ TY Property เก็บและใช้ข้อมูลนี้เพื่อติดต่อกลับเกี่ยวกับรายการนี้เท่านั้น ตาม<a href="#/privacy" target="_blank">นโยบายความเป็นส่วนตัว</a></span></label>`;
const token = () => localStorage.getItem('tyToken');
const LOGIN_URL = `${API}/api/auth/google/start`;
const LOGIN_NEEDED = 'login';

let listings = [], me = null, gal = { imgs: [], i: 0 }, ready = false;
let commissionRate = null; // อัตราค่าบริการ (โหลดจากเซิร์ฟเวอร์ตอนเปิดเว็บ)

// อนิเมชันเปิดเว็บเล่นครั้งเดียวต่อแท็บ กดข้ามได้
(function intro() {
  const el = $('intro');
  if (sessionStorage.getItem('introSeen') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.remove();
    document.body.classList.add('ready');
    return;
  }
  sessionStorage.setItem('introSeen', '1');
  let finished = false;
  // เมื่อเปิดเว็บครั้งแรก ให้เอฟเฟกต์รายการและหน้าเริ่มหลังโลโก้เปิดจบ จะได้เห็นชัดๆ
  const done = () => {
    if (finished) return;
    finished = true;
    el.classList.add('out');
    setTimeout(() => { el.remove(); document.body.classList.add('ready'); }, 700);
  };
  el.onclick = done;
  setTimeout(done, 2600);
})();

async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(token() ? { Authorization: 'Bearer ' + token() } : {}), ...(opts.headers || {}) },
    });
  } catch {
    throw new Error('เชื่อมต่อระบบไม่ได้ ลองอีกครั้งในอีกสักครู่');
  }
  if (r.status === 401) { localStorage.removeItem('tyToken'); me = null; throw new Error(LOGIN_NEEDED); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
  return data;
}

// ขอให้เข้าสู่ระบบก่อนทำรายการที่ต้องใช้บัญชี (กดถูกใจ ส่งแบบฟอร์ม)
function needLogin(action) {
  if (confirm(`กรุณาเข้าสู่ระบบด้วย Google ก่อน${action}\nกดตกลงเพื่อเข้าสู่ระบบ`)) {
    document.body.classList.add('leaving');
    setTimeout(() => { location.href = LOGIN_URL; }, reduceMotion() ? 0 : 320);
  }
}

async function logout() {
  document.body.classList.add('leaving');
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  localStorage.removeItem('tyToken');
  setTimeout(() => { location.href = location.pathname; }, reduceMotion() ? 0 : 320);
}

function header() {
  const account = me
    ? `<span class="me">${me.picture ? `<img src="${esc(me.picture)}" alt="">` : ''}<span>${esc(me.name)}</span></span>
    <button class="out" onclick="logout()">ออกจากระบบ</button>`
    : `<a class="login" href="${LOGIN_URL}">เข้าสู่ระบบ</a>`;
  const cur = location.hash || '#/';
  const link = (h, t) => `<a href="${h}"${cur === h ? ' aria-current="page"' : ''}>${t}</a>`;
  $('links').innerHTML = link('#/', 'ทั้งหมด') + link('#/liked', 'ที่ถูกใจ') + link('#/sell', 'ฝากขาย');
  $('acct').innerHTML = account;
  movePill();
}

function hero() {
  const open = listings.filter(l => l.status === 'available');
  const low = open.length ? money(Math.min(...open.map(l => l.price))) : '-';
  return `<section class="hero"><div class="hero-in">
    <div>
      <h1>ที่ดินและบ้านคัดสรร ซื้อขาย</h1>
      <p>ตรวจข้อมูลก่อนตัดสินใจ และวางเงินมัดจำผ่านบัญชีเอสโครว์ เพื่อให้ทั้งผู้ซื้อและผู้ขายปลอดภัย</p>
      <div class="stats"><div><b data-n="${open.length}">${open.length}</b><span>รายการว่างขาย</span></div><div><b>${low}</b><span>ราคาเริ่มต้น</span></div></div>
    </div>
    <div class="plate"><img src="logo.png" alt="TY Property Land & Auction"></div>
  </div></section>`;
}

function home(liked) {
  const top = liked
    ? '<div class="pagehead"><h1>รายการที่ถูกใจ</h1><p>รายการที่คุณกดหัวใจไว้ กลับมาดูได้ตลอด</p></div>'
    : hero();
  return `${top}<div class="wrap">
    <div class="tools">
      <input id="q" type="search" placeholder="ค้นหาทำเลหรือชื่อประกาศ" oninput="renderRows()">
      <select id="pt" onchange="renderRows()">
        <option value="">ทุกประเภท</option>
        ${Object.entries(TYPE).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
      </select>
      <select id="pr" onchange="renderRows()">
        <option value="">ทุกช่วงราคา</option><option value="1">ไม่เกิน 5 ล้าน</option>
        <option value="2">5 ถึง 20 ล้าน</option><option value="3">20 ถึง 100 ล้าน</option><option value="4">มากกว่า 100 ล้าน</option>
      </select>
      <select id="st" onchange="renderRows()">
        <option value="">ทุกสถานะ</option><option value="available">ว่างขาย</option>
        <option value="reserved">จองแล้ว</option><option value="sold">ขายแล้ว</option>
      </select>
      <select id="so" onchange="renderRows()">
        <option value="new">ใหม่ล่าสุด</option><option value="low">ราคาต่ำไปสูง</option><option value="high">ราคาสูงไปต่ำ</option>
      </select>
    </div>
    <div class="list" id="rows"></div>
  </div>`;
}

function renderRows() {
  const q = $('q').value.trim().toLowerCase(), pt = $('pt').value, pr = $('pr').value, st = $('st').value, so = $('so').value;
  const liked = location.hash === '#/liked';
  const items = listings.filter(l =>
    (!st || l.status === st) &&
    (!pt || l.property_type === pt) &&
    (!pr || (l.price >= PRICE[pr][0] && l.price < PRICE[pr][1])) &&
    (!liked || l.liked) &&
    (l.title + ' ' + l.location).toLowerCase().includes(q));
  if (so === 'low') items.sort((a, b) => a.price - b.price);
  if (so === 'high') items.sort((a, b) => b.price - a.price);
  let empty = 'ไม่พบรายการที่ตรงกับเงื่อนไข ลองเปลี่ยนคำค้นหรือตัวกรอง';
  if (liked) empty = me ? 'ยังไม่มีรายการที่ถูกใจ กดหัวใจที่รายการที่สนใจได้เลย'
    : `เข้าสู่ระบบด้วย Google เพื่อดูรายการที่ถูกใจที่บันทึกไว้ <a href="${LOGIN_URL}">เข้าสู่ระบบ</a>`;
  $('rows').innerHTML = items.length ? items.map((l, i) => row(l, i)).join('') : `<p class="empty">${empty}</p>`;
  hydrate($('rows'));
}

const row = (l, i = 0) => `<div class="row ${l.status === 'sold' ? 'sold' : ''}" style="--i:${Math.min(i, 10)}" onclick="location.hash='#/listing/${l.id}'">
  <div class="thumb pending" data-bg="${esc(l.images[0] || '')}"></div>
  <div>
    <h3>${esc(l.title)}${chip(l)}</h3>
    <div class="meta">${esc(l.location)}</div>
    <div class="meta">${brief(l)}</div>
    ${badge(l)}
  </div>
  <div class="side"><div class="price">${money(l.price)}</div>${heart(l)}</div>
</div>`;

const mini = l => `<a class="mini" href="#/listing/${l.id}"><div class="t pending" data-bg="${esc(l.images[0] || '')}"></div><div class="x"><h4>${esc(l.title)}</h4><p>${money(l.price)}</p></div></a>`;

function detail(id) {
  const l = listings.find(x => x.id == id);
  gal = { imgs: l ? (l.images.length ? l.images : ['']) : [], i: 0 };
  if (!l) return '<div class="wrap"><p class="empty">ไม่พบรายการนี้ <a href="#/">กลับไปดูรายการทั้งหมด</a></p></div>';

  const land = l.property_type === 'land';
  const wah = l.rai * 400 + l.ngan * 100 + l.wah;
  const specs = land
    ? [['ขนาดที่ดิน', size(l)], ['ราคาเฉลี่ยต่อ ตร.ว.', wah ? money(Math.round(l.price / wah)) : '-']]
    : [['ห้องนอน', l.bedrooms || '-'], ['ห้องน้ำ', l.bathrooms || '-'], ['พื้นที่ใช้สอย', l.usable_sqm ? `${l.usable_sqm} ตร.ม.` : '-'], ['ขนาดที่ดิน', size(l)]];
  const map = l.map_url || `https://www.google.com/maps/search/${encodeURIComponent(l.location)}`;
  const many = gal.imgs.length > 1;
  const others = listings
    .filter(x => x.id !== l.id && x.status !== 'sold')
    .sort((a, b) => (a.property_type === l.property_type ? 0 : 1) - (b.property_type === l.property_type ? 0 : 1))
    .slice(0, 3);

  return `<div class="wrap">
  <div class="detail">
    <div>
      <div class="gallery" id="main">
        ${many ? '<button class="gnav prev" onclick="showImg(gal.i-1)" aria-label="รูปก่อนหน้า">‹</button><button class="gnav next" onclick="showImg(gal.i+1)" aria-label="รูปถัดไป">›</button>' : ''}
        <span class="cnt" id="cnt"></span>
      </div>
      ${many ? `<div class="thumbs">${gal.imgs.map((u, k) => `<div style="${img(u)}" onclick="showImg(${k})"></div>`).join('')}</div>` : ''}
    </div>
    <div>
      <div class="row-top">${badge(l)}${heart(l)}</div>
      <h1 class="ttl">${esc(l.title)}</h1>
      <div class="price big">${money(l.price)}</div>
      <div class="specs">${specs.map(([k, v]) => `<div><b>${esc(v)}</b><span>${k}</span></div>`).join('')}</div>
      <dl>
        <dt>ประเภท</dt><dd>${TYPE[l.property_type] || TYPE.land}</dd>
        <dt>ทำเล</dt><dd>${esc(l.location)}</dd>
        <dt>เอกสารสิทธิ์</dt><dd>${esc(l.deed_type) || '-'}</dd>
      </dl>
      <p style="white-space:pre-line">${esc(l.description)}</p>
      <div class="btns">
        <a class="btn" href="${lineUrl('สนใจ ' + l.title)}" target="_blank" rel="noopener">แชต LINE กับทีมงาน</a>
        <a class="btn line" href="tel:${CONTACT.phone}">โทรสอบถาม</a>
        <a class="btn line" href="${esc(map)}" target="_blank" rel="noopener">ดูแผนที่</a>
      </div>
      <div class="linkrow">
        <span class="muted">แชร์:</span>
        <a class="btn line sm" href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">ส่งทาง LINE</a>
        <button class="btn line sm" onclick="copyLink(this)">คัดลอกลิงก์</button>
      </div>
      <h3 class="sub">ขั้นตอนการซื้อ</h3>
      <ol class="steps">
        <li>ยื่นข้อเสนอซื้อและแจ้งความประสงค์กับทีมงาน</li>
        <li>วางเงินมัดจำผ่านบัญชีเอสโครว์ตามข้อตกลง</li>
        <li>ตรวจเอกสารและรายละเอียดทรัพย์สินก่อนนัดโอน</li>
        <li>โอนกรรมสิทธิ์ที่สำนักงานที่ดิน ค่าธรรมเนียมและภาษีคำนวณตามราคาประเมิน ทีมงานจะแจ้งให้ทราบก่อนนัดโอน</li>
      </ol>
    </div>
  </div>

  <div class="panel">
    <h3>สนใจรายการนี้ ส่งข้อมูลให้ทีมงานติดต่อกลับ</h3>
    <form onsubmit="sendLead(event,'inquiry')">
      <input type="hidden" name="listing_id" value="${l.id}">
      <div class="two">
        <label>ชื่อ<input name="name" required></label>
        <label>เบอร์โทรศัพท์<input name="phone" inputmode="tel" required></label>
      </div>
      <label>ข้อความถึงทีมงาน<textarea name="message" rows="3">สนใจ ${esc(l.title)}</textarea></label>
      ${consentBox()}
      <button class="btn">ส่งข้อมูล</button>
      <p class="fmsg"></p>
    </form>
  </div>

}

function showImg(i) {
  const n = gal.imgs.length;
  gal.i = (i + n) % n;
  const main = $('main');
  main.style.backgroundImage = gal.imgs[gal.i] ? `url('${gal.imgs[gal.i]}')` : '';
  if (main.animate && !reduceMotion()) main.animate([{ opacity: .35, transform: 'scale(1.03)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.2,.7,.2,1)' });
  $('cnt').textContent = n > 1 ? `${gal.i + 1} / ${n}` : '';
  document.querySelectorAll('.thumbs div').forEach((d, k) => d.classList.toggle('on', k === gal.i));
}

// ===== ลูกเล่น: ประกาย ข้อความเด้ง และตัวเลขวิ่งขึ้น =====
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// ประกายดาวกระจายจากปุ่มที่กด บอกว่าการกดสำเร็จ
function sparkle(el, n = 14) {
  if (reduceMotion()) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ['#1f5bd8', '#e11d48', '#f5b301', '#14794a', '#7c3aed'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const d = 50 + Math.random() * 46;
    p.className = 'spark';
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i % colors.length]};` +
      `--dx:${(Math.cos(a) * d).toFixed(1)}px;--dy:${(Math.sin(a) * d).toFixed(1)}px;--rot:${Math.round(Math.random() * 360)}deg;` +
      `border-radius:${i % 3 ? '50%' : '2px'}`;
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

// เล่นแอนิเมชันซ้ำได้ทุกครั้งที่กด
function pop(el, cls = 'pop') {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ตัวเลขวิ่งขึ้นถึงค่าจริง
function countUp(el) {
  if (reduceMotion()) return;
  const end = Number(el.dataset.n), t0 = performance.now(), dur = 900;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(end * e).toLocaleString('th-TH');
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = '0';
  requestAnimationFrame(step);
}

async function like(id, e) {
  e.stopPropagation();
  if (!me) return needLogin('กดถูกใจ');
  const btn = e.currentTarget;
  try {
    const r = await api(`/api/listings/${id}/like`, { method: 'POST' });
    listings.find(x => x.id === id).liked = r.liked;
    btn.classList.toggle('on', r.liked);
    pop(btn);
    if (r.liked) sparkle(btn, 10);
    toast(r.liked ? 'เพิ่มในรายการที่ถูกใจแล้ว' : 'นำออกจากรายการที่ถูกใจแล้ว');
  } catch (err) {
    if (err.message === LOGIN_NEEDED) needLogin('กดถูกใจ'); else toast(err.message);
  }
}

function copyLink(btn) {
  navigator.clipboard.writeText(location.href).then(
    () => { btn.textContent = 'คัดลอกแล้ว ✓'; pop(btn, 'bump'); toast('คัดลอกลิงก์แล้ว'); },

}

async function sendLead(e, kind) {
  e.preventDefault();
  const f = e.target, out = f.querySelector('.fmsg'), btn = f.querySelector('button.btn');
  if (!me) return needLogin('ส่งข้อมูล');
  const data = Object.fromEntries(new FormData(f));
  data.kind = kind;
  data.consent = f.elements.consent.checked;
  const label = btn.textContent;
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'กำลังส่ง...';
  out.textContent = '';
  try {
    const res = await api('/api/leads', { method: 'POST', body: JSON.stringify(data) });
    f.reset();
    if (kind === 'sell') sellCalc(f);
    const text = kind === 'sell'
      ? `ส่งข้อมูลเรียบร้อย ยอดที่คุณจะได้รับหลังหักค่าบริการ ${res.commission_rate}% คือ ${money(res.net_amount)} ทีมงานจะติดต่อกลับโดยเร็ว`
      : 'ส่งข้อมูลเรียบร้อย ทีมงานจะติดต่อกลับโดยเร็ว';
    out.innerHTML = '<span class="done-badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span></span></span>';
    out.querySelector('.done-badge > span').textContent = text;
    btn.classList.remove('loading');
    btn.textContent = 'ส่งเรียบร้อย ✓';
    sparkle(btn, 18);
    toast('ส่งเรียบร้อยแล้ว ✓');
    setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2400);
  } catch (err) {
    btn.classList.remove('loading');
    btn.textContent = label;
    btn.disabled = false;
    if (err.message === LOGIN_NEEDED) needLogin('ส่งข้อมูล'); else out.textContent = err.message;
  }
}

// คำนวณค่าบริการและยอดที่ผู้ขายจะได้รับ (เซิร์ฟเวอร์คำนวณซ้ำอีกครั้งตอนส่ง)
let sellPrev = { fee: 0, net: 0 };
function sellCalc(f) {
  const out = $('sellCalc');
  if (!f || !out) return;
  if (commissionRate === null) {
    out.textContent = 'ไม่สามารถโหลดอัตราค่าบริการได้ กรุณารีเฟรชหน้า';
  } else {
    const price = Number(String(f.elements.asking_price.value).replace(/\D/g, '')) || 0;
    if (!price) {
      out.textContent = `ทีมงานหักค่าบริการ ${commissionRate}% จากราคาที่ตั้งขาย กรอกราคาเพื่อดูยอดที่คุณจะได้รับ`;
      sellPrev = { fee: 0, net: 0 };
    } else {
      const fee = Math.round(price * commissionRate / 100), net = price - fee;
      out.innerHTML = `ราคาที่ตั้งขาย ${money(price)}<br>ค่าบริการ ${commissionRate}% (<span data-num="fee">${money(sellPrev.fee)}</span>)<br><b>ยอดที่คุณจะได้รับ <span data-num="net">${money(sellPrev.net)}</span></b>`;
      tween(out.querySelector('[data-num="fee"]'), fee, sellPrev.fee);
      tween(out.querySelector('[data-num="net"]'), net, sellPrev.net);
      sellPrev = { fee, net };
    }
  }
  pop(out, 'bump');
}

    revealOnScroll($('app'));

// ===================== ตัวช่วยการเคลื่อนไหว =====================
const DEPTH = h => (h.startsWith('#/listing/') ? 2 : 1);
let lastHash = null;

// เปลี่ยนหน้าแบบมีทิศทาง: เข้าไปดูรายการเลื่อนจากขวา กลับออกมาเลื่อนจากซ้าย
function navigate() {
  const to = location.hash || '#/', from = lastHash || '#/';
  lastHash = to;
  const dir = DEPTH(to) > DEPTH(from) ? 'forward' : DEPTH(to) < DEPTH(from) ? 'back' : 'fade';
  document.documentElement.dataset.nav = dir;
  if (document.startViewTransition && !reduceMotion()) document.startViewTransition(() => route());
  else route();
}

// เม็ดสีของเมนูเลื่อนไปยังเมนูที่เปิดอยู่
function movePill() {
  const pill = $('pill'), nav = $('nav'), active = nav && nav.querySelector('a[aria-current="page"]');
  if (!pill) return;
  if (!active) { pill.style.opacity = '0'; return; }
  const nr = nav.getBoundingClientRect(), ar = active.getBoundingClientRect();
  const first = !pill.dataset.ready;
  if (first) pill.style.transition = 'none';
  pill.style.width = ar.width + 'px';
  pill.style.transform = `translateX(${ar.left - nr.left + nav.scrollLeft}px)`;
  pill.style.opacity = '1';
  if (first) { void pill.offsetWidth; pill.style.transition = ''; pill.dataset.ready = '1'; }
}

// รูปที่โหลดเสร็จจะค่อยๆ ปรากฏ ระหว่างนั้นแสดงแถบเลื่อนแสง
function hydrate(root = document) {
  root.querySelectorAll('[data-bg]').forEach(el => {
    const u = el.dataset.bg;
    el.removeAttribute('data-bg');
    if (!u) { el.classList.remove('pending'); return; }
    const im = new Image();
    im.onload = () => { el.style.backgroundImage = `url('${u.replace(/'/g, '%27')}')`; el.classList.remove('pending'); el.classList.add('img-in'); };
    im.onerror = () => el.classList.remove('pending');
    im.src = u;
  });
}

// ตัวเลขยอดเงินเลื่อนจากค่าเดิมไปค่าใหม่
function tween(el, to, from = 0, fmt = money, dur = 650) {
  if (!el) return;
  if (reduceMotion() || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  el.textContent = fmt(from);
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ส่วนต่างๆ ของหน้าค่อยๆ ปรากฏเมื่อเลื่อนมาถึง
function revealOnScroll(root) {
  if (reduceMotion() || !('IntersectionObserver' in window)) return;
  const els = root.querySelectorAll('.specs > div, dl, .steps li, .panel, .similar .mini');
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  els.forEach((el, i) => { el.classList.add('reveal'); el.style.setProperty('--d', i % 6); io.observe(el); });
}

// รูปโลโก้ขยับตามเคอร์เซอร์เล็กน้อย (เฉพาะเมาส์)
function tiltPlate(plate) {
  if (!matchMedia('(pointer: fine)').matches) return;
  const im = plate.querySelector('img');
  plate.addEventListener('pointermove', e => {
    if (reduceMotion()) return;
    const r = plate.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    im.style.transform = `perspective(900px) rotateX(${(-y * 8).toFixed(2)}deg) rotateY(${(x * 10).toFixed(2)}deg) scale(1.03)`;
  });
  plate.addEventListener('pointerleave', () => { im.style.transform = ''; });
}

// ช่องที่กรอกไม่ครบจะสั่นและขึ้นขอบแดง
document.addEventListener('invalid', e => {
  const el = e.target;
  el.classList.add('bad');
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}, true);
document.addEventListener('input', e => { if (e.target.classList) e.target.classList.remove('bad'); }, true);
document.addEventListener('animationend', e => { if (e.animationName === 'shake') e.target.classList.remove('shake'); });

// ปุ่มมีแสงกระเพื่อมตรงจุดที่กด
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn');
  if (!b || b.disabled || reduceMotion()) return;
  const r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2;
  const k = document.createElement('span');
  k.className = 'ripple';
  k.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
  b.appendChild(k);
  k.addEventListener('animationend', () => k.remove());
});

// แถบความคืบหน้าและเงาหัวเว็บ ตามการเลื่อน
let scrollTick = false;
addEventListener('scroll', () => {
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    $('progress').style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
    document.querySelector('header').classList.toggle('scrolled', scrollY > 8);
  });
}, { passive: true });
addEventListener('resize', movePill);

addEventListener('hashchange', () => ready && navigate());
